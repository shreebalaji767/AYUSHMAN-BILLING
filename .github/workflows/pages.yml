name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static application JavaScript
        run: node --check static/js/app.js
      - name: Validate static site entry points
        run: |
          test -s index.html
          test -s static/css/style.css
          test -s static/css/print.css
          test -s static/js/app.js
          test -s sw.js
          python -c "import json; json.load(open('static/manifest.webmanifest', encoding='utf-8')); json.load(open('data/packages.json', encoding='utf-8'))"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
